<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI ATS Resume &amp; Keyword Optimizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#0a0a0a;
        --glass:#1e1e1e;
        --glass-alpha:rgba(30,30,30,.7);
        --accent:#00bfff;
        --text:#e0e0e0;
        --text-muted:#a0a0a0;
        --radius:12px;
        --transition:0.3s ease;
        --font:"Inter",sans-serif;
    }
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
    }
    body{
        font-family:var(--font);
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:1rem;
    }
    h1{
        font-weight:700;
        margin:1rem 0;
        color:var(--accent);
        text-align:center;
    }
    .glass{
        background:var(--glass-alpha);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        border-radius:var(--radius);
        padding:1.5rem;
        width:100%;
        max-width:900px;
        margin:1rem 0;
        box-shadow:0 8px 32px 0 rgba(0,0,0,.37);
        transition:var(--transition);
    }
    textarea{
        width:100%;
        min-height:150px;
        background:var(--glass);
        border:none;
        border-radius:var(--radius);
        color:var(--text);
        padding:0.8rem;
        font-size:1rem;
        resize:vertical;
        outline:none;
    }
    textarea::placeholder{
        color:var(--text-muted);
    }
    button{
        background:var(--accent);
        color:#fff;
        border:none;
        border-radius:var(--radius);
        padding:0.8rem 1.6rem;
        font-size:1rem;
        font-weight:600;
        cursor:pointer;
        transition:var(--transition);
        margin-top:0.5rem;
    }
    button:hover{
        background:#0099d9;
        transform:scale(1.02);
    }
    .output{
        margin-top:1rem;
        background:var(--glass);
        border-radius:var(--radius);
        padding:1rem;
        color:var(--text);
        overflow-x:auto;
        line-height:1.5;
    }
    .chips{
        display:flex;
        flex-wrap:wrap;
        gap:0.5rem;
        margin-top:0.5rem;
    }
    .chip{
        background:var(--accent);
        color:#fff;
        padding:0.3rem 0.6rem;
        border-radius:999px;
        font-size:0.9rem;
    }
    #loader{
        display:none;
        margin-top:1rem;
        border:4px solid var(--glass);
        border-top:4px solid var(--accent);
        border-radius:50%;
        width:30px;
        height:30px;
        animation:spin 1s linear infinite;
    }
    @keyframes spin{
        to{transform:rotate(360deg);}
    }
    /* Ad placeholders */
    .ad-slot{
        width:100%;
        max-width:970px;
        height:90px;
        background:var(--glass);
        border-radius:var(--radius);
        display:flex;
        align-items:center;
        justify-content:center;
        color:var(--text-muted);
        font-size:0.9rem;
        margin:0.5rem 0;
    }
    @media (max-width:600px){
        textarea{min-height:120px;}
        .ad-slot{height:60px;}
    }
</style>
</head>
<body>
    <div id="ad-slot-top" class="ad-slot">[Ad Slot Top – 970x90]</div>

    <h1>AI ATS Resume &amp; Keyword Optimizer</h1>

    <div class="glass">
        <label for="resume">📄 Paste Your Resume</label>
        <textarea id="resume" placeholder="Your current resume..."></textarea>

        <label for="jobdesc" style="margin-top:1rem; display:block;">📝 Paste Job Description</label>
        <textarea id="jobdesc" placeholder="The job posting you are targeting..."></textarea>

        <button id="optimizeBtn">Optimize Resume</button>
        <div id="loader"></div>

        <div id="keywordsSection" class="output" style="display:none;">
            <strong>Top Keywords:</strong>
            <div class="chips" id="keywordChips"></div>
        </div>

        <div id="optimizedSection" class="output" style="display:none;">
            <strong>Optimized Resume Preview:</strong>
            <pre id="optimizedText"></pre>
        </div>
    </div>

    <div id="ad-slot-bottom" class="ad-slot">[Ad Slot Bottom – 970x90]</div>

<script>
(() => {
    const stopwords = new Set(["the","and","a","an","to","for","of","in","on","with","as","by","is","are","was","were","be","will","would","should","could","or","if","it","this","that","these","those","from","at","into","about","up","down","out","over","under","again","once"]);
    const optimizeBtn = document.getElementById('optimizeBtn');
    const loader = document.getElementById('loader');
    const keywordsSection = document.getElementById('keywordsSection');
    const keywordChips = document.getElementById('keywordChips');
    const optimizedSection = document.getElementById('optimizedSection');
    const optimizedText = document.getElementById('optimizedText');

    const clean = str => str.toLowerCase().replace(/[^a-z0-9\s]/g,' ');
    const getWords = txt => clean(txt).split(/\s+/).filter(w=>w && !stopwords.has(w));

    const getTopKeywords = (text, count = 10) => {
        const freq = {};
        getWords(text).forEach(w=>{
            freq[w] = (freq[w]||0)+1;
        });
        return Object.entries(freq)
                     .sort((a,b)=>b[1]-a[1])
                     .slice(0,count)
                     .map(e=>e[0]);
    };

    const buildOptimizedResume = (resume, keywords) => {
        const kwSection = "\n\n---\nRelevant Keywords: " + keywords.join(', ') + "\n---\n";
        return resume.trim() + kwSection;
    };

    const showLoader = show => {
        loader.style.display = show ? 'block' : 'none';
    };

    optimizeBtn.addEventListener('click',()=>{
        const resume = document.getElementById('resume').value.trim();
        const jobdesc = document.getElementById('jobdesc').value.trim();

        if(!resume || !jobdesc){
            alert('Please fill both fields.');
            return;
        }

        showLoader(true);
        // Simulate async processing (e.g., AI call)
        setTimeout(()=>{
            const topKeywords = getTopKeywords(jobdesc);
            keywordChips.innerHTML = topKeywords.map(k=>`<div class="chip">${k}</div>`).join('');
            keywordsSection.style.display='block';

            const optimized = buildOptimizedResume(resume, topKeywords);
            optimizedText.textContent = optimized;
            optimizedSection.style.display='block';

            showLoader(false);
        }, 800);
    });
})();
</script>
</body>
</html>
